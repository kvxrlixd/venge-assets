
<div class="field-wrap"> 
    <div class="field">
        <div class="label-wrap">
            <label for="achromatopsia">{{translate('Achromatopsia Filter')}}</label>
            <label for="achromatopsia">{{translate('(Black-White)')}}</label>
        </div>

        <div class="form-element-wrap">
            <div class="field-toggle-wrapper">
                <input class="toggle" v-on:change="onSettingsChange()" 
                        type="checkbox" id="achromatopsia"
                        v-model="settings.achromatopsia">
                <label for="achromatopsia">
                    <span v-html="settings.achromatopsia == true ? translate('Yes') : translate('No')"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="field">
        <div class="label-wrap">
            <label for="deuteranopia">{{translate('Deuteranopia Filter')}}</label>

                    <span v-html="settings.deuteranopia == true ? translate('Yes') : translate('No')"></span>
                </label>
            </div>
        </div>
    </div>
</div>
