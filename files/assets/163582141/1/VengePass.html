<div id="wrapper" class="shop">
    <div id="header">
        <div class="header-left-wrap">
            <span v-on:click="goBackVengePass()" class="back-button">
                <i class="fa fa-arrow-circle-o-left" aria-hidden="true"></i>
            </span>
            <span v-if="vengePassPage == 'Main'" class="header-title">
                {{translate('VENGE PASS')}}  
            </span>
            <span v-if="vengePassPage == 'Buy'" class="header-title">
                {{translate('BACK')}}  
            </span>
        </div>

        <div class="header-right-wrap">
            <ul id="header-info-items">
                <li v-on:click="getPaymentOffers()" style="display: flex; justify-content: space-between;">
                    <span v-if="balance" class="balance" style="color: #d4af37; display: flex; align-items: center;">
                        <b style="margin-left: auto; display: flex; align-items: center;">
                            <img :src="getImage('Coin-Icon.png')" alt="" style="filter: opacity(0.6) drop-shadow(0 0 0 yellow);">
                            <span style="color: #ffffff; margin-right: 5px;">{{ balance }}</span>
                        </b>
                        <b style="margin-left: auto; display: flex; align-items: center;">
                            <img :src="getImage('Coin-Icon.png')" alt="" style="filter: opacity(0.9) drop-shadow(0 0 0 blue);">
                            <span style="color: #ffffff; margin-right: 5px;">{{ premiumBalance }}</span>
                        </b>
                    </span>
                    <span v-if="balance" class="balance" style="color: #fffff; display: flex; align-items: center; font-size: 1.0em;">
                        + {{translate('Buy')}}
                    </span>
                </li>
            </ul>
        </div> 
    </div>

    <div v-if="popup.active" class="shadow" v-on:click="closePopup()"></div>
    <div v-if="popup.active">
        @import "Menu.Quests.html"
        @import "Shop.Code.html"
        @import "Shop.PaymentOffers.html"
    </div>
</div>
