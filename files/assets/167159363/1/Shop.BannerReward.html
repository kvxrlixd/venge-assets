<div v-if="popup.page == 'BannerReward'" class="popup">
    <div class="popup-header">
        <i class="fa fa-cube" aria-hidden="true"></i> {{translate('FreeVG')}}
        <a v-on:click="closePopup()" href="javascript:;" class="popup-close"><i class="fa fa-times" aria-hidden="true"></i></a>
    </div>
    <div class="popup-content">
        <div v-if="popup.loading" class="popup-loading">
            <div id="spinner-center">
                <div class="lds-ring">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>

        <p class="centered-white-text with-bar">
            <img :src="getImage('Large-Coins.png')">
            <br>
            {{translate('WatchADFreeVG-1')}} {{shop.maxUnlockWithAds}} {{translate('WatchADFreeVG-2')}}<br>{{translate('WatchADFreeVG-3')}}
        </p>
        <div class="bar-wrapper">
            <div class="bar" :style="{ width: 50 * shop.canUnlockWithAds + '%' }"></div>
            <div class="bar-count"> 
                <p>
                    <span> {{shop.canUnlockWithAds}}</span> / <span> {{shop.maxUnlockWithAds}}</span>
                </p>
            </div>
        </div>
        

        <div class="popup-bottom-content right-align">
            <div 
                v-if="alert.active"
                class="alert"
                :class="{'alert-danger' : alert.type == 'danger', 'alert-info' : alert.type == 'info'}"
            >
                <i v-if="alert.type == 'danger'" class="fa fa-exclamation-triangle" aria-hidden="true"></i> 
                <i v-if="alert.type == 'info'" class="fa fa-exclamation-circle" aria-hidden="true"></i> 
                {{alert.message}}
            </div>

            <span v-if="isLoggedIn">
                <button class="btn btn-primary button-sound" v-on:click="watchRewardCount()">
                    🎬 {{translate('Get Free VG')}}
                </button>
            </span>

            <span v-if="!isLoggedIn">
                <button class="btn btn-secondary button-sound" v-on:click="goLogin('Account')">
                    <i class="fa fa-user" aria-hidden="true"></i> {{translate('You Need to Login')}} 
                </button>
            </span>
            
        </div>
    </div>
</div>
